<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bone_converter - Tripo 骨骼转换 Demo（D1）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; color: #eee; background: #1e1e1e; }
        #app { display: flex; flex-direction: column; height: 100vh; }

        /* 顶部工具栏 */
        #toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #2d2d2d; border-bottom: 1px solid #444; flex-wrap: wrap; }
        #toolbar button { padding: 6px 14px; font-size: 13px; cursor: pointer; border: 1px solid #555; border-radius: 4px; background: #3c3c3c; color: #eee; }
        #toolbar button:hover { background: #4a4a4a; }
        #toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 主区域：左面板 / 视口 / 右面板 */
        #main { flex: 1; display: flex; overflow: hidden; }
        #left-panel, #right-panel { width: 260px; background: #252526; border-right: 1px solid #444; display: flex; flex-direction: column; }
        #right-panel { border-right: none; border-left: 1px solid #444; }
        .panel-header { padding: 8px 10px; font-weight: bold; background: #333; border-bottom: 1px solid #444; }
        .panel-body { flex: 1; overflow: auto; padding: 6px; }
        #bone-list, #track-list { list-style: none; }
        #bone-list li, #track-list li { padding: 2px 6px; font-family: Consolas, monospace; font-size: 12px; white-space: nowrap; }
        #bone-list li:nth-child(odd), #track-list li:nth-child(odd) { background: #2a2a2b; }
        #bone-count, #track-count { color: #7cc7ff; font-weight: normal; }

        /* 中央视口 */
        #viewport { flex: 1; position: relative; background: #1e1e1e; }
        #viewport canvas { display: block; width: 100%; height: 100%; }

        /* 底部日志 */
        #log-bar { height: 160px; background: #1b1b1b; border-top: 1px solid #444; display: flex; flex-direction: column; }
        #log-header { padding: 4px 10px; font-weight: bold; background: #333; border-bottom: 1px solid #444; }
        #log-area { flex: 1; overflow: auto; padding: 4px 8px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.5; }
        #log-area .log-line { color: #ccc; }
        #log-area .log-ok { color: #6fd06f; }
        #log-area .log-warn { color: #e5c07b; }
        #log-area .log-error { color: #ff6b6b; }
        #log-area .log-info { color: #7cc7ff; }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button id="btn-load-model">加载 Tripo 模型</button>
            <button id="btn-load-official">加载 Mixamo 官方模型(lod2)</button>
            <button id="btn-convert" disabled>Tripo→Mixamo 转换</button>
            <button id="btn-load-anim" disabled>加载 Mixamo 动画</button>
            <button id="btn-play" disabled>播放</button>
            <button id="btn-stop" disabled>停止</button>
            <span id="status" style="margin-left:8px; color:#999;"></span>
        </div>
        <div id="main">
            <div id="left-panel">
                <div class="panel-header">骨骼列表 <span id="bone-count"></span></div>
                <div class="panel-body"><ul id="bone-list"></ul></div>
            </div>
            <div id="viewport"></div>
            <div id="right-panel">
                <div class="panel-header">动画轨道列表 <span id="track-count"></span></div>
                <div class="panel-body"><ul id="track-list"></ul></div>
            </div>
        </div>
        <div id="log-bar">
            <div id="log-header">日志</div>
            <div id="log-area"></div>
        </div>
    </div>
    <script>
        // 由 webpack 注入 bundle
    </script>
</body>
</html>
